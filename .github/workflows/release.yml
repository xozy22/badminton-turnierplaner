name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
            rust_targets: ''
          - platform: ubuntu-22.04
            args: ''
            rust_targets: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust_targets: 'aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y             libwebkit2gtk-4.1-dev             libappindicator3-dev             librsvg2-dev             patchelf             build-essential             curl             wget             file             libssl-dev             libgtk-3-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The release body used to be the literal string "Release v2.9.0",
      # and the updater feed copied it into `notes` -- so that is what the
      # update dialog showed people. It now comes from CHANGELOG.md.
      #
      # The step fails when the tag has no changelog entry, which is the
      # right moment to notice: before the artefacts exist.
      - name: Read release notes from the changelog
        id: notes
        shell: bash
        run: |
          node scripts/build-release-notes.mjs --notes "${{ github.ref_name }}" > RELEASE_NOTES.md
          echo "Release notes for ${{ github.ref_name }}:"
          cat RELEASE_NOTES.md

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          APPLE_SIGNING_IDENTITY: ${{ contains(matrix.platform, 'macos') && '-' || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBodyPath: RELEASE_NOTES.md
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  cleanup:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Remove .sig files from release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for asset in $(gh release view ${{ github.ref_name }} --repo ${{ github.repository }} --json assets -q '.assets[].name' | grep '\.sig$'); do
            gh release delete-asset ${{ github.ref_name }} "$asset" --repo ${{ github.repository }} --yes
          done
