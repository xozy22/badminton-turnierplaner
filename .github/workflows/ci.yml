name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A newer push to the same branch makes the running job pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (types, tests, build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # Node 24: node:sqlite is available unflagged, which the
          # migration schema test (src/test/migrations.test.ts) needs.
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc -b

      - name: Unit tests
        run: pnpm test:coverage

      - name: Build
        run: pnpm exec vite build

      # --- Advisory for now ------------------------------------------------
      # Lint is down from 64 findings to 14, all of them React-effect
      # patterns that belong to the data-loading rework (D7/D8), plus the
      # i18n key check (H2). Both run on every commit so the numbers stay
      # visible; drop `continue-on-error` once those items are done.
      - name: Lint (advisory — see REVIEW-BACKLOG.md D3)
        continue-on-error: true
        run: pnpm lint

      - name: i18n key check (advisory — see REVIEW-BACKLOG.md H2)
        continue-on-error: true
        run: pnpm check:i18n

      # Enforced, not advisory: this one starts at zero and stays there.
      # Emoji crept back twice after F10, both times in a spelling the
      # previous sweep could not see.
      - name: Emoji check
        run: pnpm check:emoji

  rust:
    name: Rust (tauri backend)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tauri::generate_context! reads tauri.conf.json at compile time and
      # requires the configured frontendDist directory to exist.
      - name: Build frontend
        run: pnpm exec vite build

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --locked

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test --locked

      - name: Clippy (advisory)
        continue-on-error: true
        working-directory: src-tauri
        run: cargo clippy --locked -- -D warnings
